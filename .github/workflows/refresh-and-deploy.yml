name: Refresh and deploy

# Daily show-data refresh for the Cloudflare Pages project mineraldigger.
# The timer is the Cloudflare Worker diggers-rebuild (Diggers account), not a
# GitHub schedule. It dispatches this workflow daily at 05:17 UTC, which is
# 05:17 in winter (GMT) and 06:17 in summer (BST), early morning in Europe/London.
# This does not run on push. Merging the workflow file does not deploy.
# The refreshed catalogue is built and deployed from the runner. It is not
# committed. Catalogue changes on main still go through pull requests.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh show data
        run: python3 scripts/refresh.py --live --write

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name mineraldigger --branch main --commit-dirty=true

      - name: Tell IndexNow about changed pages
        run: python3 scripts/indexnow.py
