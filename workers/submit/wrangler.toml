# MineralDigger show submissions.
# Route only /api/submit. The rest of each hostname stays on Cloudflare Pages.
# Deploy from this directory:
#   npx wrangler login
#   npx wrangler deploy
#
# Email Routing is not assumed to be live.
# Before mail will send, on the Cloudflare account for mineraldigger.com:
#   1. Turn on Email Routing for mineraldigger.com.
#   2. Verify mineraldigger.hq@gmail.com as an Email Routing destination.
#   3. Allow the sender submissions@mineraldigger.com (the domain must be on this account).
# MINERALDIGGER_SUBMIT_TO and destination_address must stay the same address.
# There is no secret to put for the destination. The Gmail address itself has to be verified.
# TURNSTILE_SECRET_KEY is already set with `wrangler secret put`. It is not a
# var in this file. `wrangler deploy` keeps that secret. Do not commit the value.

name = "mineraldigger-submit"
main = "src/index.js"
compatibility_date = "2026-10-25"
account_id = "f856dac626b67bcd86aee0824fad569f"
workers_dev = false

routes = [
  { pattern = "mineraldigger.com/api/submit", zone_name = "mineraldigger.com" },
  { pattern = "www.mineraldigger.com/api/submit", zone_name = "mineraldigger.com" },
  { pattern = "mineraldigger.co.uk/api/submit", zone_name = "mineraldigger.co.uk" },
  { pattern = "www.mineraldigger.co.uk/api/submit", zone_name = "mineraldigger.co.uk" },
]

[vars]
MINERALDIGGER_SUBMIT_TO = "mineraldigger.hq@gmail.com"
MINERALDIGGER_SUBMIT_FROM = "submissions@mineraldigger.com"

[[send_email]]
name = "SEND_EMAIL"
allowed_sender_addresses = ["submissions@mineraldigger.com"]
destination_address = "mineraldigger.hq@gmail.com"

# Cloudflare only allows a period of 10 or 60 seconds. This caps a burst at
# 5 listings per minute. The worker still refuses a sixth listing from the
# same IP inside 10 minutes, including when this binding is missing.
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
